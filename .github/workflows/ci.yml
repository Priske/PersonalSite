name: dotnet-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore
      - name: Run tests
        run: >
          dotnet test
          --no-restore
          --logger "console;verbosity=detailed"
          --blame-hang
          --blame-hang-timeout 3m
