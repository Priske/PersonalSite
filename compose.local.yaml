services:
  postgres:
    image: postgres:17
    container_name: personal-site-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: personal_site
      POSTGRES_USER: personal_site
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - personal-site-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U personal_site -d personal_site"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: PersonalSite.Api/Dockerfile
    container_name: personal-site-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__PersonalSite: >
        Host=postgres;
        Port=5432;
        Database=personal_site;
        Username=personal_site;
        Password=${POSTGRES_PASSWORD}

      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: PersonalSite.Api
      Jwt__Audience: PersonalSite.Client
      DevelopmentAdmin__Password: ${DEVELOPMENT_ADMIN_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  personal-site-postgres-data:
  